name: Deploy Obsidian Engine Tools to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'discord-css/**'
      - 'obs-text/**'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# GitHub Pagesへの書き込み権限設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行制限（デプロイの競合回避）
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ビルドジョブ
  build:
    runs-on: ubuntu-latest
    
    steps:
      # リポジトリチェックアウト
      - name: Checkout
        uses: actions/checkout@v7

      # Node.js環境セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            ./discord-css/package-lock.json
            ./obs-text/package-lock.json

      # GitHub Pages設定
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: other

      # Discord CSS Generator依存関係インストール
      - name: Install Discord CSS dependencies
        working-directory: ./discord-css
        run: npm ci

      # Discord CSS Generator Viteビルド実行
      - name: Build Discord CSS with Vite
        working-directory: ./discord-css
        run: npm run build
        env:
          NODE_ENV: production

      # OBS Text依存関係インストール
      - name: Install OBS Text dependencies
        working-directory: ./obs-text
        run: npm ci

      # OBS Text Viteビルド実行（Firebase環境変数を注入）
      - name: Build OBS Text with Vite
        working-directory: ./obs-text
        run: npm run build
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

      # 古いビルド結果のクリーンアップとディレクトリ作成
      - name: Clean and create main site directory
        run: |
          rm -rf ./dist
          mkdir -p ./dist

      # メインページファイルをdistディレクトリにコピー
      - name: Copy main site files
        run: |
          cp index.html ./dist/
          cp style.css ./dist/
          cp script.js ./dist/

      # Discord CSS Generatorビルド結果をサブディレクトリにコピー
      - name: Copy Discord CSS build
        run: cp -r ./discord-css/dist ./dist/discord-css

      # Comment CSS ディレクトリをコピー
      - name: Copy Comment CSS
        run: cp -r ./comment-css ./dist/comment-css

      # OBS Text ビルド結果をサブディレクトリにコピー
      - name: Copy OBS Text build
        run: cp -r ./obs-text/dist ./dist/obs-text

      # Jekyll処理を無効化するファイルを作成
      - name: Create .nojekyll file
        run: touch ./dist/.nojekyll

      # GitHub Pages用成果物アップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub Pagesデプロイ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          clean: true

  # デプロイ完了通知（オプション）
  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "🚀 Obsidian Engine デプロイ成功！"
            echo "📍 メインサイト: https://obsidian-engine.github.io/vtube-tools/"
            echo "🎨 Discord CSS: https://obsidian-engine.github.io/vtube-tools/discord-css/"
            echo "📝 OBS Text: https://obsidian-engine.github.io/vtube-tools/obs-text/"
          else
            echo "❌ デプロイ失敗"
            exit 1
          fi