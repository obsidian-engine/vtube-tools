# 週 1 回、依存の更新 PR を作る。minor と patch は 1 本の PR にまとめる。
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /discord-css
      - /obs-text
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
